apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

bases:
  - ../../base

replicas:
  - name: api-service
    count: 3

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api-service
    spec:
      template:
        spec:
          containers:
            - name: web
              resources:
                limits:
                  cpu: "1000m"
                  memory: "512Mi"
